# Cloudflare Pages Configuration
# This file is specifically designed for Cloudflare Pages deployment
# Pages only supports "preview" and "production" environments

name = "zeidgeist-prompter"
compatibility_date = "2024-01-15"
pages_build_output_dir = "dist"

# Node.js compatibility for Functions
compatibility_flags = ["nodejs_compat"]

# Default environment variables for production
[vars]
NODE_ENV = "production"
APP_ENV = "production"
API_BASE_URL = "https://mstprmpt.zeidgeist.com"

# Production environment configuration
[env.production]
name = "zeidgeist-prompter-production"

[env.production.vars]
NODE_ENV = "production"
APP_ENV = "production"
API_BASE_URL = "https://mstprmpt.zeidgeist.com"

# Production KV namespaces
[[env.production.kv_namespaces]]
binding = "SESSION_STORAGE"
id = "production-sessions"

[[env.production.kv_namespaces]]
binding = "CACHE_STORAGE"
id = "production-cache"

# Production Durable Objects
[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "rate-limiter"

# Preview environment configuration (for PR deployments)
[env.preview]
name = "zeidgeist-prompter-preview"

[env.preview.vars]
NODE_ENV = "preview"
APP_ENV = "preview"
API_BASE_URL = "https://preview.mstprmpt.zeidgeist.com"

# Preview KV namespaces
[[env.preview.kv_namespaces]]
binding = "SESSION_STORAGE"
preview_id = "dev-sessions"

[[env.preview.kv_namespaces]]
binding = "CACHE_STORAGE"
preview_id = "dev-cache"

# Preview Durable Objects
[[env.preview.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "rate-limiter"

# Observability settings
[observability]
enabled = true