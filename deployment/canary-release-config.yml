# Canary Release Configuration for Security Enhancement Deployment
# Zero-downtime deployment strategy: 10% → 50% → 100%

apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-deployment-config
  namespace: production
data:
  # Deployment Strategy
  strategy: |
    phases:
      - name: "initial-canary"
        traffic_percentage: 10
        duration: "30m"
        success_criteria:
          error_rate_threshold: 0.1
          latency_p99_threshold: 500
          security_violation_threshold: 0
      - name: "expanded-canary"
        traffic_percentage: 50
        duration: "1h"
        success_criteria:
          error_rate_threshold: 0.05
          latency_p99_threshold: 300
          security_violation_threshold: 0
      - name: "full-deployment"
        traffic_percentage: 100
        duration: "indefinite"
        monitoring_period: "24h"

  # Rollback Triggers
  rollback_conditions: |
    - error_rate > 0.1%
    - latency_p99 > 1000ms
    - security_violations > 0
    - critical_alerts > 0
    - user_complaints > 5

  # Health Checks
  health_checks: |
    endpoints:
      - path: "/api/engineer/history"
        method: "GET"
        expected_status: 200
        timeout: 5s
      - path: "/api/health/privacy"
        method: "GET"
        expected_status: 200
        timeout: 3s
    
    security_validation:
      - test: "cross_user_isolation"
        frequency: "5m"
      - test: "rate_limiting"
        frequency: "10m"
      - test: "privacy_headers"
        frequency: "1m"

  # Monitoring Alerts
  alerts: |
    - name: "security_violation_detected"
      condition: "privacy_monitor.violations > 0"
      severity: "critical"
      notification: ["security-team", "on-call"]
    
    - name: "error_rate_spike"
      condition: "error_rate > 0.1%"
      severity: "high"
      notification: ["devops-team"]
    
    - name: "latency_degradation"
      condition: "latency_p99 > 500ms"
      severity: "medium"
      notification: ["performance-team"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy-enhanced-api
  namespace: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: privacy-enhanced-api
  template:
    metadata:
      labels:
        app: privacy-enhanced-api
        version: "enhanced"
    spec:
      containers:
      - name: api
        image: zeidgeist/prompter:enhanced-security
        ports:
        - containerPort: 8788
        env:
        - name: PRIVACY_MONITORING_ENABLED
          value: "true"
        - name: ENHANCED_SECURITY_HEADERS
          value: "true"
        - name: AUDIT_LOGGING_LEVEL
          value: "detailed"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8788
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8788
          initialDelaySeconds: 5
          periodSeconds: 5