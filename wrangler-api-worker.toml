# Cloudflare Workers deployment for API (separate from Pages)

name = "zeidgeist-prompter-api"
main = "./src/worker.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Use workers.dev by default. Add routes in Cloudflare dashboard for a custom subdomain like:
# routes = [
#   { pattern = "api.mstprmpt.zeidgeist.com/*", zone_name = "zeidgeist.com" }
# ]
workers_dev = true

# Production route
routes = [
  { pattern = "api.mstprmpt.zeidgeist.com/*", zone_name = "zeidgeist.com" }
]

[vars]
NODE_ENV = "production"
APP_ENV = "production"

[[kv_namespaces]]
binding = "SESSION_STORAGE"
id = "ebdc9af6ea5549029446fc55a8984b24"
preview_id = "2001d92c064b45569a78fbd3add9baa5"

[[kv_namespaces]]
binding = "CACHE_STORAGE"
id = "866d020c22a9413f9c8b636b38910396"
preview_id = "bcebbeeb90384dfa8e43ec7ad4ca4910"

# Durable Objects for Rate Limiting (optional - KV fallback is used if unavailable)
# Requires a separate Worker deployment with the RateLimiter DO class
# [[durable_objects.bindings]]
# name = "RATE_LIMITER"
# class_name = "RateLimiter"
# script_name = "rate-limiter"

# D1 Database for auth tables (shared with Pages)
[[d1_databases]]
binding = "AUTH_DB"
database_name = "zeidgeist-auth"
database_id = "2ceef6e7-9ba6-48a4-a1ec-214d2c54f5d2"

# Scheduled triggers for learning cycle
[triggers]
crons = ["0 2 * * *"]  # Daily at 2 AM UTC

[observability]
enabled = true
head_sampling_rate = 0.1  # 10% sampling for cost-conscious production
