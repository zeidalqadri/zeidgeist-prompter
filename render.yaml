services:
  - type: web
    name: zeidgeist-prompter
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /prompter/api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: USE_EXTERNAL_APIS
        value: true
      - key: BASE_PATH
        value: /prompter
      - key: MONGODB_URI
        value: mongodb+srv://zeidalqadri:[REPLACE_WITH_PASSWORD]@zeidgeist-cluster.vuiut.mongodb.net/prompter?retryWrites=true&w=majority&tls=true
        # Replace [REPLACE_WITH_PASSWORD] with actual password in Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false 