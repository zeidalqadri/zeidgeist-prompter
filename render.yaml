services:
  - type: web
    name: zeidgeist-prompter
    runtime: node
    plan: starter
    region: ohio
    buildCommand: ./render-build.sh
    startCommand: node backend/src/api.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /prompter
      - key: USE_EXTERNAL_APIS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: zeidgeist-db
          property: connectionString
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - backend/**/*
        - frontend/**/*
        - render-build.sh
      ignoredPaths:
        - .dockerignore
        - **/*.Dockerfile
        - **/Dockerfile
        - **/docker-compose.yml

databases:
  - name: zeidgeist-db
    ipAllowList: [] 