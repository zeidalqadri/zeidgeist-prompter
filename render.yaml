services:
  - type: web
    name: zeidgeist-prompter
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: node backend/src/api.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /prompter
      - key: USE_EXTERNAL_APIS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: zeidgeist-db
          property: connectionString

databases:
  - name: zeidgeist-db
    ipAllowList: [] 