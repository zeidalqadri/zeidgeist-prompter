name: Production Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to monitor'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  production-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Set environment URLs
      id: env-setup
      run: |
        echo "base_url=https://mstprmpt.zeidgeist.com" >> $GITHUB_OUTPUT

    - name: Health Check
      run: |
        echo "=== Health Check ==="
        response=$(curl -s -w "\n%{http_code}" --max-time 30 ${{ steps.env-setup.outputs.base_url }}/api/health)
        http_code=$(echo "$response" | tail -1)
        body=$(echo "$response" | sed '$d')

        if [ "$http_code" = "200" ]; then
          echo "✅ Health check passed (HTTP $http_code)"
          echo "$body" | head -5
        else
          echo "❌ Health check failed (HTTP $http_code)"
          echo "$body"
          exit 1
        fi

    - name: Liveness Check
      run: |
        echo "=== Liveness Check ==="
        curl -f --max-time 30 ${{ steps.env-setup.outputs.base_url }}/api/health/liveness || exit 1
        echo ""
        echo "✅ Liveness OK"

    - name: Readiness Check
      run: |
        echo "=== Readiness Check ==="
        curl -f --max-time 30 ${{ steps.env-setup.outputs.base_url }}/api/health/readiness || exit 1
        echo ""
        echo "✅ Readiness OK"

    - name: Uptime Check
      run: |
        echo "=== Uptime Check ==="
        endpoints=(
          "${{ steps.env-setup.outputs.base_url }}/"
          "${{ steps.env-setup.outputs.base_url }}/api/health"
          "${{ steps.env-setup.outputs.base_url }}/api/health/liveness"
        )

        failed=0
        total=${#endpoints[@]}

        for endpoint in "${endpoints[@]}"; do
          if curl -f --max-time 30 "$endpoint" > /dev/null 2>&1; then
            echo "✅ $endpoint"
          else
            echo "❌ $endpoint"
            ((failed++))
          fi
        done

        echo "Results: $((total - failed))/$total endpoints healthy"
        if [ "$failed" -eq "$total" ]; then
          exit 1
        fi

    - name: API Response Time
      run: |
        echo "=== Response Time ==="
        start_time=$(date +%s%N)
        curl -s --max-time 30 ${{ steps.env-setup.outputs.base_url }}/api/health/liveness > /dev/null
        end_time=$(date +%s%N)

        response_time=$(( (end_time - start_time) / 1000000 ))
        echo "Response time: ${response_time}ms"

        if [ "$response_time" -gt 5000 ]; then
          echo "⚠️  High response time"
        else
          echo "✅ Response time OK"
        fi

    - name: SSL Certificate Check
      run: |
        echo "=== SSL Certificate ==="
        cert_info=$(echo | openssl s_client -servername mstprmpt.zeidgeist.com -connect mstprmpt.zeidgeist.com:443 2>/dev/null | openssl x509 -noout -dates 2>/dev/null)

        if [ -n "$cert_info" ]; then
          echo "✅ SSL certificate is valid"
          echo "$cert_info"
        else
          echo "⚠️  Could not retrieve SSL certificate info"
        fi

    - name: Security Headers Check
      run: |
        echo "=== Security Headers ==="
        response=$(curl -sI --max-time 30 ${{ steps.env-setup.outputs.base_url }}/ 2>/dev/null)

        if [ -z "$response" ]; then
          echo "⚠️  Could not fetch headers"
          exit 0
        fi

        headers=(
          "X-Content-Type-Options"
          "Referrer-Policy"
        )

        for header in "${headers[@]}"; do
          if echo "$response" | grep -qi "$header"; then
            echo "✅ $header present"
          else
            echo "⚠️  $header missing"
          fi
        done

    - name: Database Health
      run: |
        echo "=== Database Health ==="
        response=$(curl -s --max-time 30 ${{ steps.env-setup.outputs.base_url }}/api/health)

        if [ -z "$response" ]; then
          echo "❌ Could not reach health endpoint"
          exit 1
        fi

        db_status=$(echo "$response" | python3 -c "import sys,json; data=json.load(sys.stdin); checks=[c for c in data.get('checks',[]) if c['name']=='database']; print(checks[0]['status'] if checks else 'unknown')" 2>/dev/null || echo "unknown")

        echo "Database status: $db_status"
        if [ "$db_status" = "healthy" ]; then
          echo "✅ Database is healthy"
        elif [ "$db_status" = "unknown" ]; then
          echo "⚠️  Could not determine database status"
        else
          echo "❌ Database is $db_status"
          exit 1
        fi
