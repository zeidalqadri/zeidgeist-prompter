name: PR Preview Management

# Add explicit permissions for GitHub Actions
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  deployments: write

on:
  pull_request:
    branches: [ master, main ]
    types: [opened, synchronize, reopened, closed, ready_for_review]

jobs:
  # Skip draft PRs for resource efficiency
  check-pr-status:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
    - name: Check if PR should be deployed
      id: check
      run: |
        if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "Skipping preview deployment for draft PR"
        elif [[ "${{ github.event.action }}" == "closed" ]]; then
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          echo "PR closed, will trigger cleanup"
        else
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "PR ready for preview deployment"
        fi

  # Update PR with deployment status
  update-pr-status:
    runs-on: ubuntu-latest
    needs: check-pr-status
    if: needs.check-pr-status.outputs.should-deploy == 'true'
    
    steps:
    - name: Update PR with deployment start
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          const body = `## 🚀 Preview Deployment Started
          
          Your changes are being deployed to a preview environment...
          
          **Status:** 🔄 Building and deploying
          
          **What's happening:**
          - ✅ PR opened/updated
          - 🔄 Running tests and security checks
          - ⏳ Building application
          - ⏳ Deploying to Cloudflare Pages
          - ⏳ Running health checks
          
          **Estimated time:** 3-5 minutes
          
          ---
          
          *This comment will be updated when deployment completes.*`;
          
          // Check for existing bot comment
          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: pr_number
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.login === 'github-actions[bot]' && 
            comment.body.includes('🚀 Preview Deployment')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: botComment.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body
            });
          }

  # Generate PR preview metadata
  generate-pr-metadata:
    runs-on: ubuntu-latest
    needs: check-pr-status
    if: needs.check-pr-status.outputs.should-deploy == 'true'
    
    outputs:
      pr-metadata: ${{ steps.metadata.outputs.metadata }}
    
    steps:
    - name: Generate PR metadata
      id: metadata
      run: |
        PR_METADATA=$(cat << EOF
        {
          "pr_number": "${{ github.event.number }}",
          "title": "${{ github.event.pull_request.title }}",
          "branch": "${{ github.head_ref }}",
          "base_branch": "${{ github.base_ref }}",
          "author": "${{ github.event.pull_request.user.login }}",
          "commit_sha": "${{ github.sha }}",
          "created_at": "${{ github.event.pull_request.created_at }}",
          "updated_at": "${{ github.event.pull_request.updated_at }}",
          "preview_url": "https://preview-pr-${{ github.event.number }}.zeidgeist-prompter.pages.dev",
          "is_draft": "${{ github.event.pull_request.draft }}",
          "labels": $(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -c '[.[] | .name]'),
          "requested_reviewers": $(echo '${{ toJson(github.event.pull_request.requested_reviewers) }}' | jq -c '[.[] | .login]')
        }
        EOF
        )
        
        echo "metadata<<EOF" >> $GITHUB_OUTPUT
        echo "$PR_METADATA" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  # Enhanced preview deployment with better error handling
  deploy-preview-enhanced:
    runs-on: ubuntu-latest
    needs: [check-pr-status, generate-pr-metadata]
    if: needs.check-pr-status.outputs.should-deploy == 'true'
    
    environment: 
      name: preview-pr-${{ github.event.number }}
      url: https://preview-pr-${{ github.event.number }}.zeidgeist-prompter.pages.dev
    
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: true
    
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NODE_ENV: preview
      APP_ENV: preview
      APP_VERSION: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.number }}
      GITHUB_HEAD_REF: ${{ github.head_ref }}
      DEPLOYMENT_URL: https://preview-pr-${{ github.event.number }}.zeidgeist-prompter.pages.dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate required secrets for preview deployment
      run: |
        echo "🔐 Validating required secrets for preview deployment..."
        
        # Check critical secrets
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "❌ CLOUDFLARE_API_TOKEN is required for deployment"
          exit 1
        fi
        
        if [ -z "$STAGING_DATABASE_URL" ]; then
          echo "❌ STAGING_DATABASE_URL is required for preview"
          exit 1
        fi
        
        if [ -z "$STAGING_JWT_SECRET" ]; then
          echo "❌ STAGING_JWT_SECRET is required for authentication"
          exit 1
        fi
        
        if [ -z "$STAGING_NEXTAUTH_SECRET" ]; then
          echo "❌ STAGING_NEXTAUTH_SECRET is required for NextAuth"
          exit 1
        fi
        
        # Check at least one AI API key is available
        api_keys_available=0
        [ ! -z "$CLAUDE_API_KEY" ] && api_keys_available=$((api_keys_available + 1))
        [ ! -z "$OPENAI_API_KEY" ] && api_keys_available=$((api_keys_available + 1))
        [ ! -z "$MISTRAL_API_KEY" ] && api_keys_available=$((api_keys_available + 1))
        
        if [ $api_keys_available -eq 0 ]; then
          echo "❌ At least one AI API key (CLAUDE_API_KEY, OPENAI_API_KEY, or MISTRAL_API_KEY) is required"
          exit 1
        fi
        
        echo "✅ All required secrets are configured for preview"
        echo "✅ $api_keys_available AI API key(s) available"
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        STAGING_NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate preview environment
      run: |
        echo "🔍 Validating preview environment..."
        node -e "
          const { validatePreviewEnvironment } = require('./app/lib/config/preview-environment.js');
          validatePreviewEnvironment();
        "

    - name: Build for preview with enhanced settings
      run: npm run build
      env:
        NODE_ENV: preview
        APP_ENV: preview
        NEXT_PUBLIC_APP_ENV: preview
        NEXT_PUBLIC_API_URL: https://preview-pr-${{ github.event.number }}.zeidgeist-prompter.pages.dev
        NEXT_PUBLIC_ENVIRONMENT: preview
        NEXT_PUBLIC_PR_NUMBER: ${{ github.event.number }}
        NEXT_PUBLIC_BRANCH: ${{ github.head_ref }}
        NEXT_PUBLIC_COMMIT: ${{ github.sha }}
        NEXT_PUBLIC_FEATURE_FLAGS: '{"preview_mode":true,"debug_tools":true,"experimental_features":true}'

    - name: Deploy to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        workingDirectory: '.'
        command: pages deploy dist --project-name=zeidgeist-prompter --branch=preview-pr-${{ github.event.number }} --compatibility-date=2024-01-15 --config=wrangler.pages.toml
      env:
        DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    - name: Wait and verify deployment
      id: verify
      run: |
        echo "⏳ Waiting for deployment to be ready..."
        PREVIEW_URL="https://preview-pr-${{ github.event.number }}.zeidgeist-prompter.pages.dev"
        
        # Wait for deployment with progressive backoff
        max_attempts=30
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Attempt $attempt/$max_attempts: Checking $PREVIEW_URL"
          
          if curl -f --max-time 30 -s "$PREVIEW_URL" > /dev/null 2>&1; then
            echo "✅ Preview deployment is accessible!"
            
            # Additional health check
            if curl -f --max-time 30 -s "$PREVIEW_URL/api/health/liveness" > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              echo "deployment_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              echo "deployment_status=success" >> $GITHUB_OUTPUT
              break
            else
              echo "⚠️  Site accessible but health check failed"
            fi
          fi
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Deployment verification failed after $max_attempts attempts"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          sleep_time=$((attempt * 10))  # Progressive backoff
          echo "⏳ Waiting ${sleep_time}s before next attempt..."
          sleep $sleep_time
          ((attempt++))
        done

    - name: Run comprehensive preview tests
      run: |
        echo "🧪 Running preview deployment tests..."
        
        # Quick smoke test
        npm run test:smoke -- --baseURL=${{ steps.verify.outputs.deployment_url }}
      env:
        BASE_URL: ${{ steps.verify.outputs.deployment_url }}
        CI: true
      continue-on-error: true  # Don't fail deployment for test failures

    - name: Generate detailed deployment report
      run: |
        cat << EOF > preview-deployment-report.json
        {
          "deployment": {
            "pr_number": ${{ github.event.number }},
            "url": "${{ steps.verify.outputs.deployment_url }}",
            "status": "${{ steps.verify.outputs.deployment_status }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.head_ref }}",
            "timestamp": "$(date -Iseconds)"
          },
          "pr_details": ${{ needs.generate-pr-metadata.outputs.pr-metadata }},
          "environment": {
            "node_version": "20",
            "build_command": "npm run build",
            "deployment_platform": "Cloudflare Pages",
            "database": "staging",
            "features_enabled": {
              "debug_tools": true,
              "experimental_features": true,
              "preview_mode": true,
              "relaxed_security": true
            }
          },
          "testing": {
            "smoke_tests": "completed",
            "health_checks": "passed",
            "accessibility": "not_tested",
            "performance": "not_tested"
          },
          "links": {
            "preview": "${{ steps.verify.outputs.deployment_url }}",
            "health": "${{ steps.verify.outputs.deployment_url }}/api/health",
            "api_status": "${{ steps.verify.outputs.deployment_url }}/api/health/liveness"
          }
        }
        EOF

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preview-deployment-pr-${{ github.event.number }}
        path: |
          preview-deployment-report.json
          dist/
        retention-days: 14

    - name: Update PR with success
      if: steps.verify.outputs.deployment_status == 'success'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          // Read deployment report
          const report = JSON.parse(fs.readFileSync('preview-deployment-report.json', 'utf8'));
          
          const body = `## 🚀 Preview Deployment Ready
          
          Your changes have been successfully deployed to a preview environment!
          
          **📱 Preview URL:** [${{ steps.verify.outputs.deployment_url }}](${{ steps.verify.outputs.deployment_url }})
          
          ### 🔍 Testing Checklist
          Please test the following areas:
          
          #### ✅ Functional Testing
          - [ ] **Core Features**: All main functionality works correctly
          - [ ] **Authentication**: Login/logout and user management
          - [ ] **API Endpoints**: All API calls return expected responses
          - [ ] **Database Operations**: Data is correctly stored and retrieved
          - [ ] **Error Handling**: Appropriate error messages are shown
          
          #### 🎨 UI/UX Testing  
          - [ ] **Visual Consistency**: Design matches expectations
          - [ ] **Responsive Design**: Works on different screen sizes
          - [ ] **Interactive Elements**: Buttons, forms, and links function properly
          - [ ] **Loading States**: Appropriate loading indicators
          - [ ] **Accessibility**: Basic keyboard navigation and screen reader support
          
          #### 🔒 Security Testing
          - [ ] **Authentication**: Proper login restrictions
          - [ ] **Authorization**: Correct access controls
          - [ ] **Data Validation**: Forms properly validate input
          - [ ] **Error Information**: No sensitive data exposed in errors
          
          #### ⚡ Performance Testing
          - [ ] **Page Load Speed**: Initial page loads quickly (< 3s)
          - [ ] **API Response Time**: API calls respond promptly (< 2s)
          - [ ] **Console Errors**: No JavaScript errors in browser console
          - [ ] **Network Requests**: Reasonable number of requests
          
          ### 📊 Deployment Information
          - **Environment**: Preview
          - **Commit**: [\`${{ github.sha }}\`](${{ github.event.repository.html_url }}/commit/${{ github.sha }})
          - **Branch**: \`${{ github.head_ref }}\`
          - **Deployed**: $(date -Iseconds)
          - **Status**: ✅ Healthy
          
          ### 🔗 Quick Links
          - [🏠 Homepage](${{ steps.verify.outputs.deployment_url }})
          - [🩺 Health Check](${{ steps.verify.outputs.deployment_url }}/api/health)
          - [⚡ API Status](${{ steps.verify.outputs.deployment_url }}/api/health/liveness)
          
          ### 🛠️ Debug Information
          <details>
          <summary>Technical Details</summary>
          
          - **Platform**: Cloudflare Pages
          - **Node.js**: v20
          - **Database**: Staging environment
          - **Build Command**: \`npm run build\`
          - **Environment Variables**: Preview configuration
          - **Features**: Debug tools enabled, experimental features available
          - **Security**: Relaxed policies for testing
          
          **Preview Limitations:**
          - Uses staging database (not production data)
          - No real-time monitoring or analytics
          - Relaxed rate limiting and CORS policies
          - Temporary deployment (cleaned up when PR closes)
          </details>
          
          ---
          
          🎯 **Ready for review!** Please test the functionality and approve when satisfied.
          
          *This preview will be automatically updated when new commits are pushed and cleaned up when the PR is closed.*`;
          
          // Update existing comment or create new one
          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: pr_number
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.login === 'github-actions[bot]' && 
            comment.body.includes('🚀 Preview Deployment')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: botComment.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body
            });
          }

    - name: Update PR with failure
      if: steps.verify.outputs.deployment_status != 'success'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          const body = `## ❌ Preview Deployment Failed
          
          The preview deployment for this PR has failed. Please check the workflow logs for details.
          
          **Error Details:**
          - **Status**: Failed during verification
          - **Commit**: \`${{ github.sha }}\`
          - **Workflow**: [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          **Next Steps:**
          1. Check the workflow logs for specific error messages
          2. Fix any build or deployment issues
          3. Push a new commit to retry the deployment
          
          ---
          
          *This comment will be updated when the deployment is retried.*`;
          
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: pr_number,
            body
          });

  # Cleanup when PR is closed
  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cleanup preview deployment
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        workingDirectory: '.'
        command: pages deployment delete --project-name=zeidgeist-prompter --branch=preview-pr-${{ github.event.number }} --force
      continue-on-error: true

    - name: Comment on PR cleanup
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          const body = `## 🧹 Preview Deployment Cleaned Up
          
          The preview deployment has been automatically cleaned up since this PR was closed.
          
          **Cleanup Details:**
          - **Preview URL**: ~~https://preview-pr-${pr_number}.zeidgeist-prompter.pages.dev~~ *(No longer available)*
          - **Environment**: Preview resources deallocated
          - **Status**: ✅ Successfully cleaned up
          
          ${context.payload.pull_request.merged ? 
            '🎉 **PR was merged!** Changes will be deployed to staging automatically.' : 
            '📝 **PR was closed without merging.** No further action needed.'
          }
          
          Thank you for contributing! 🚀`;
          
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: pr_number,
            body
          });