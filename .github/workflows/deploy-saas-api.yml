name: Deploy SaaS API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'mstprmpt-saas/**'
      - '.github/workflows/deploy-saas-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: 107.174.228.85
  VPS_USER: root
  DEPLOY_PATH: /opt/mstprmpt-saas

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ env.VPS_HOST }}
          REMOTE_USER: ${{ env.VPS_USER }}
          SOURCE: mstprmpt-saas/
          TARGET: ${{ env.DEPLOY_PATH }}/
          EXCLUDE: node_modules/, .git/, .env
          ARGS: -rlgoDzvc --delete

      - name: Install deps and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mstprmpt-saas
            npm ci --production
            systemctl restart mstprmpt-api.service
            sleep 3
            systemctl is-active mstprmpt-api.service

      - name: Health check
        run: |
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -sf --max-time 10 "https://api.mstprmpt.zeidgeist.com/v1/health" > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed, retrying..."
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "Health check failed after $max_attempts attempts"
          exit 1
