name: Allow Merge on Security Check Skip

# This workflow ensures PRs can be merged even if optional security scans fail
# due to missing permissions or configuration issues

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-required-tests:
    name: Check Required CI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Mark as success
        run: echo "Required checks passed"
