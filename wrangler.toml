# Cloudflare Pages configuration for static Next.js with Pages Functions
name = "zeidgeist-prompter"
compatibility_date = "2024-01-15"
pages_build_output_dir = "out"

# Node.js compatibility for Pages Functions
compatibility_flags = ["nodejs_compat"]

# R2 Bucket bindings for image storage
[[r2_buckets]]
binding = "IMAGE_STORAGE"
bucket_name = "zeidgeist-images-prod"
preview_bucket_name = "zeidgeist-images-dev"

# KV Namespaces for caching and optimization
[[kv_namespaces]]
binding = "CACHE_STORAGE"
id = "866d020c22a9413f9c8b636b38910396"
preview_id = "bcebbeeb90384dfa8e43ec7ad4ca4910"

[[kv_namespaces]]
binding = "SESSION_STORAGE"
id = "ebdc9af6ea5549029446fc55a8984b24"
preview_id = "2001d92c064b45569a78fbd3add9baa5"

# KV Namespace for image generation progress tracking
[[kv_namespaces]]
binding = "PROGRESS_TRACKER"
id = "progress_tracker_prod"
preview_id = "progress_tracker_dev"

# Note: Scheduled triggers (cron) are not supported for Pages
# Cache warming can be triggered manually via /api/scheduled/cache-warmer endpoint
# Or set up via Cloudflare Workers cron triggers separately

# Observability
[observability]
enabled = true

# Routes configuration
# This tells Pages to use Functions for API routes
# while serving static assets for everything else
