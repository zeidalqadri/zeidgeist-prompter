# Cloudflare Workers deployment for API (separate from Pages)

name = "zeidgeist-prompter-api"
main = "./src/worker.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Use workers.dev by default. Add routes in Cloudflare dashboard for a custom subdomain like:
# routes = [
#   { pattern = "api.mstprmpt.zeidgeist.com/*", zone_name = "zeidgeist.com" }
# ]
workers_dev = true

[vars]
NODE_ENV = "production"
APP_ENV = "production"

[[kv_namespaces]]
binding = "SESSION_STORAGE"
preview_id = "dev-sessions"
id = "production-sessions"

[[kv_namespaces]]
binding = "CACHE_STORAGE"
preview_id = "dev-cache"
id = "production-cache"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "rate-limiter"

[observability]
enabled = true

