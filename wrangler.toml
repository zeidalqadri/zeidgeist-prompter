# Cloudflare Pages configuration for static Next.js with Pages Functions
name = "aipromptise"
compatibility_date = "2024-01-15"
pages_build_output_dir = "out"

# Node.js compatibility for Pages Functions
compatibility_flags = ["nodejs_compat"]

# KV Namespaces for caching and optimization
[[kv_namespaces]]
binding = "CACHE_STORAGE"
id = "866d020c22a9413f9c8b636b38910396"
preview_id = "bcebbeeb90384dfa8e43ec7ad4ca4910"

[[kv_namespaces]]
binding = "SESSION_STORAGE"
id = "ebdc9af6ea5549029446fc55a8984b24"
preview_id = "2001d92c064b45569a78fbd3add9baa5"

# D1 Database for auth tables (Cloudflare-native, edge-optimized)
# Create with: wrangler d1 create zeidgeist-auth
# After creation, update the database_id below
[[d1_databases]]
binding = "AUTH_DB"
database_name = "zeidgeist-auth"
database_id = "2ceef6e7-9ba6-48a4-a1ec-214d2c54f5d2"  # Update after running: wrangler d1 create zeidgeist-auth

# Durable Objects for Rate Limiting
# NOTE: Durable Objects require a separate Worker deployment for Pages
#
# Current Setup (works now):
# - Uses KV-based rate limiting via rate-limiter.ts
# - HybridRateLimiter in rate-limiter-hybrid.ts provides unified interface
#
# Future Setup (for strong consistency):
# 1. Create separate Worker with RateLimiterDO class
# 2. Deploy: wrangler deploy -c wrangler.workers.toml
# 3. Add service binding below
# 4. HybridRateLimiter will automatically prefer DO over KV
#
# [[services]]
# binding = "RATE_LIMITER_SERVICE"
# service = "rate-limiter-worker"
# environment = "production"

# Note: Scheduled triggers (cron) are not supported for Pages
# Cache warming can be triggered manually via /api/scheduled/cache-warmer endpoint
# Or set up via Cloudflare Workers cron triggers separately

# Observability
[observability]
enabled = true
head_sampling_rate = 0.1  # 10% sampling for cost-conscious production

# Routes configuration
# This tells Pages to use Functions for API routes
# while serving static assets for everything else